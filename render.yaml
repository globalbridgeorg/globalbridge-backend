services:
  - type: web
    name: globalbridge-backend
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn app.wsgi --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: MODE
        value: PRODUCTION
      - key: DEBUG
        value: "False"
      - key: DB_SCHEMA
        value: django
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://globalbridge-gamma.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://globalbridge-gamma.vercel.app
